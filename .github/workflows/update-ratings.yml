name: Update US Chess ratings

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 7:17 am Mountain (13:17 UTC)
  workflow_dispatch:         # run it by hand from the Actions tab
  push:                      # and whenever the updater itself changes
    branches: [main]
    paths:
      - scripts/update_uscf.py
      - .github/workflows/update-ratings.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest results from US Chess
        run: python3 scripts/update_uscf.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uscf-history.json
          git commit -m "Update US Chess ratings"
          git push
