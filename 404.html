<style>
  :root { --navy: #13284a; --muted: #536175; --blue: #1f4e8c; --blue-on-navy: #a9c4ec; --band: #f2f6fb; --line: #d9e1ec; --white: #ffffff;
    --serif: 'Libre Caslon Text', Georgia, serif; --sans: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--sans); font-size: 1.0625rem; line-height: 1.65; color: #1b2636; background: var(--white); min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  header { border-bottom: 3px solid #b08d57; background: var(--navy); color: var(--white); padding: 96px max(24px, calc((100% - 680px) / 2)) 72px; }
  .label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--blue-on-navy); margin-bottom: 16px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 2.75rem; line-height: 1.15; }
  h1 em { color: var(--blue-on-navy); }
  header p { color: rgba(255, 255, 255, 0.78); margin-top: 16px; max-width: 56ch; }
  main { flex: 1; background: var(--band); padding: 56px max(24px, calc((100% - 680px) / 2)); }
  .links { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-block; padding: 12px 22px; border-radius: 4px; font-weight: 600; text-decoration: none; }
  .btn-primary { background: var(--navy); color: var(--white); }
  .btn-primary:hover { background: var(--blue); }
  .btn-secondary { border: 1px solid var(--navy); color: var(--navy); background: var(--white); }
  .btn-secondary:hover { border-color: var(--blue); color: var(--blue); }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  footer { border-top: 3px solid #b08d57; background: var(--navy); color: rgba(255, 255, 255, 0.55); text-align: center; padding: 24px; font-size: 0.875rem; }
  footer a { color: rgba(255, 255, 255, 0.85); text-decoration: none; }
  footer a:hover { color: #ffffff; text-decoration: underline; }
  @media (max-width: 640px) { header { padding: 64px 20px 48px; } h1 { font-size: 2.1rem; } main { padding: 40px 20px; } }
</style>

<header>
  <div class="label">Error 404</div>
  <h1>Page <em>not found</em></h1>
  <p>That page doesn't exist or has moved. Try one of these instead.</p>
</header>
<main>
  <div class="links">

  </div>
</main>
